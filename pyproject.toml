[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "advanced-kali-security-hunter"
version = "0.1.0"
description = "Authorized, read-only security assessment workbench"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7", "pydantic>=2.7", "rich>=13.7", "psutil>=5.9", "packaging>=24.0", "httpx>=0.27", "PyYAML>=6.0"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
